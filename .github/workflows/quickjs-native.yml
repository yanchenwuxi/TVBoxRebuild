name: Build QuickJS native

on:
  push:
    branches: [ main, develop ]
    paths: [ 'libs/quickjs/**', '.github/workflows/quickjs-native.yml' ]
  workflow_dispatch:

# 合规说明：本工作流只编 Bellard quickjs-ng（MIT）产出的 .so，
# 不做 Android App 全构建（CI 无真机/模拟器，且 Android 构建慢）。
# QuickJS C 源码已随仓库提交（libs/quickjs/src/main/jni/quickjs/），CI 不再联网拉取。

jobs:
  # —— 主验证：arm64-v8a 编 so + 校验 ——
  quickjs-native:
    name: 编 QuickJS so（${{ matrix.abi }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 主 ABI 推主干必跑；其余按需（可注释掉以省 CI 时长）
        abi: [ arm64-v8a ]
    steps:
      - uses: actions/checkout@v4

      # 用官方 android-actions/setup-android（比 android/setup-android 稳）：
      #   设 ANDROID_NDK_HOME/ANDROID_HOME/ANDROID_SDK_ROOT，且内置 NDK 缓存
      - name: 安装 NDK + CMake（官方 action，带缓存）
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'
          cmake-true-version: '3.22.1'

      - name: 打印 NDK 环境（排查）
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_NDK_HOME" || { echo "NDK 目录不存在"; exit 1; }
          ls "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      # C 源码已入库，无需拉取；仅做一次存在性断言
      - name: 断言 QuickJS C 源码在仓库
        run: |
          test -f libs/quickjs/src/main/jni/quickjs/quickjs.c || { echo "C 源码缺失"; exit 1; }
          echo "C 源码 OK（$(ls libs/quickjs/src/main/jni/quickjs/*.c | wc -l) 个 .c）"

      - name: NDK 编 ${{ matrix.abi }}
        run: ./libs/quickjs/build-native.sh --ndk="$ANDROID_NDK_HOME" --abi=${{ matrix.abi }}

      - name: 校验 so 产物
        run: |
          set -e
          SO=libs/quickjs/src/main/jniLibs/${{ matrix.abi }}/libquickjs_rebuild.so
          test -f "$SO" || { echo "未产出 $SO"; exit 1; }
          ls -lh "$SO"; file "$SO"

      - name: 归档 so（主 ABI）
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-jniLibs-arm64
          path: libs/quickjs/src/main/jniLibs/arm64-v8a/*.so

  # —— 可选：host 自检（证明 C 源码可编译 + 可执行 JS）——
  quickjs-host-smoke:
    name: host 自检 qjs_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 clang（sudo -E 保留 PATH）
        run: |
          sudo apt-get update
          sudo -E apt-get install -y clang
      - name: 编 host qjs_smoke 并跑（-DNDEBUG 关 host GC 断言）
        run: ./libs/quickjs/build-native.sh --host-smoke
